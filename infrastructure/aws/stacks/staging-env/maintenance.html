<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePlatform - We'll be back soon! </title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Noto+Sans:wght@400&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #181818;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .bkg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .crc {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            transition: opacity 5s ease-out, transform 0.5s ease-out;
        }
        .c1 {
            width: 40vw;
            height: 40vw;
            max-width: 400px;
            max-height: 400px;
            background-color: #5b4d8a;
        }
        .c2 {
            width: 30vw;
            height: 30vw;
            max-width: 300px;
            max-height: 300px;
            background-color: #385b5b;
        }
        .cnt {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }
        .icn {
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Archivo', sans-serif;
            font-weight: 600;
            font-size: 32px;
            line-height: 40px;
            letter-spacing: -0.25%;
            margin-bottom: 24px;
        }
        p {
            font-size: 16px;
            line-height: 24px;
            letter-spacing: 0.1%;
            margin-bottom: 16px;
        }
        .try {
            background-color: #7fffd4;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 40px 0;
        }
        .clr {
            color: #7fffd4;
            text-decoration: underline;
            cursor: pointer;
        }
        .sup {
            margin-top: 40px;
            font-size: 14px;
            line-height: 24px;
            letter-spacing: 0.1%;
        }
        .sup a {
            color: #7fffd4;
            text-decoration: none;
        }
        .discord-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: background-color 0.2s ease;
            margin-top: 16px;
        }
        .discord-btn:hover {
            background-color: #4752C4;
        }
        .discord-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="bkg">
        <div class="crc c1"></div>
        <div class="crc c2"></div>
    </div>
    <div class="cnt">
        <div class="icn">
            <svg width="33" height="32" viewBox="0 0 33 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g clip-path="url(#clip0_15831_155013)">
                    <path d="M18.4401 4.11685L30.2152 24.7514C31.0405 26.2052 29.9742 28 28.2751 28H4.72488C3.0258 28 1.95949 26.2052 2.7848 24.7514L14.5599 4.11685C15.4081 2.62772 17.5919 2.62772 18.4401 4.11685Z" stroke="#7DE8DF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16.5 24C17.3284 24 18 23.3284 18 22.5C18 21.6716 17.3284 21 16.5 21C15.6716 21 15 21.6716 15 22.5C15 23.3284 15.6716 24 16.5 24Z" fill="#7DE8DF"/>
                    <path d="M16.5 11L16.5 18" stroke="#7DE8DF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <defs>
                    <clipPath id="clip0_15831_155013">
                        <rect width="32" height="32" fill="white" transform="translate(0.5)"/>
                    </clipPath>
                </defs>
            </svg>
        </div>
        <h1>We'll be back soon!</h1>
        <p>The gameplatform is currently undergoing maintenance. We're looking into some improvements to enhance your experience.</p>
        <p>Thanks for your patience.</p>
        <button class="try" onclick="location.reload()">Try again</button>
        <p class="sup">Need Help?</p>
        <a href="https://discord.gg/Dv2qv7kgvt" target="_blank" class="discord-btn">
            <svg class="discord-icon" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            GamePlatform Discord
        </a>
    </div>

    <script>
        function clrCch() {
            if ('caches' in window) {
                caches.keys().then(function(nms) {
                    for (let nm of nms) caches.delete(nm);
                }).then(function() {
                    location.reload();
                });
            } else {
            }
        }

        setInterval(clrCch, 30000);
        setInterval(function() {
            location.reload();
        }, 30000);

        const orbCfg = {
            rad1: 200,
            rad2: 100,
            spd1: 0.007,
            spd2: 0.005,
            xScl: 1,
            yScl: 0.7,
            cOfX: 50,
            cOfY: 30
        };

        const c1 = document.querySelector('.c1');
        const c2 = document.querySelector('.c2');
        let ang1 = 0;
        let ang2 = Math.PI;

        function setCrcPos() {
            const ctrX = window.innerWidth / 2 + orbCfg.cOfX;
            const ctrY = window.innerHeight / 2 + orbCfg.cOfY;

            const c1X = ctrX + Math.cos(ang1) * orbCfg.rad1 * orbCfg.xScl;
            const c1Y = ctrY + Math.sin(ang1) * orbCfg.rad1 * orbCfg.yScl;
            c1.style.transform = `translate(${c1X - c1.offsetWidth / 2}px, ${c1Y - c1.offsetHeight / 2}px)`;

            const c2X = ctrX + Math.cos(ang2) * orbCfg.rad2 * orbCfg.xScl;
            const c2Y = ctrY + Math.sin(ang2) * orbCfg.rad2 * orbCfg.yScl;
            c2.style.transform = `translate(${c2X - c2.offsetWidth / 2}px, ${c2Y - c2.offsetHeight / 2}px)`;
        }

        function ani() {
            ang1 += orbCfg.spd1;
            ang2 += orbCfg.spd2;
            setCrcPos();
            requestAnimationFrame(ani);
        }

        function fadInCrc() {
            setTimeout(() => {
                c1.style.opacity = '0.6';
                c2.style.opacity = '0.6';
            }, 100);
        }

        window.addEventListener('resize', setCrcPos);
        setCrcPos();
        ani();
        fadInCrc();
    </script>

</body>
</html>
