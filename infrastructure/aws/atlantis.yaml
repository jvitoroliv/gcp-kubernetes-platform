workflows:
# Development Workflows
  networking-dev:
    plan:
      steps:
      - init:
          extra_args: ["-backend-config=../../environments/dev/networking-backend.hcl"]
      - plan:
          extra_args: ["-var-file", "../../environments/dev/networking.tfvars"]
    apply:
      steps:
        - apply:
            extra_args: ["-var-file", "../../environments/dev/networking.tfvars"]
    import:
      steps:
        - init:
            extra_args: ["-backend-config=../../environments/dev/networking-backend.hcl"]
