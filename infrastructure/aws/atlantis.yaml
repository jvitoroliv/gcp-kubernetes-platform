      when_modified:
        - stacks/dns-and-alb/**
        - environments/dev/dns-and-alb*.hcl
        - environments/dev/dns-and-alb*.tfvars

  - name: runners-dev
    dir: stacks/runners
    workflow: runners-dev
    terraform_version: v1.13.1
    autoplan:
      enabled: true
      when_modified:
        - stacks/runners/**
        - environments/dev/runners*.hcl
        - environments/dev/runners*.tfvars

  - name: atlantis-dev
    dir: stacks/atlantis
    workflow: atlantis-dev
    terraform_version: v1.13.1
    autoplan:
      enabled: true
      when_modified:
        - stacks/atlantis/**
        - environments/dev/atlantis*.hcl
        - environments/dev/atlantis*.tfvars

  - name: postgres-dev
