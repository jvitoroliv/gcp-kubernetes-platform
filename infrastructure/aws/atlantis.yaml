version: 3

# Atlantis config for shared infrastructure
projects:

# Development Environment
  - name: networking-dev
    dir: stacks/networking
    workflow: networking-dev
    terraform_version: v1.13.1
    autoplan:
      enabled: true
      when_modified:
        - stacks/networking/**
        - environments/dev/networking*.hcl
        - environments/dev/networking*.tfvars
    
  - name: dns-and-alb-dev
    dir: stacks/dns-and-alb
    workflow: dns-and-alb-dev
    terraform_version: v1.13.1
