# =============================================================================
# WORKFLOWS
# =============================================================================

workflows:
  gcp-workflow:
    plan:
      steps:
        - env:
            name: STACK_NAME
            command: 'echo "${HEAD_BRANCH_NAME:-main}" | grep -oE "[0-9]+-[a-z-]+" | head -1 || basename $(pwd)'
        - env:
            name: ENV_NAME
            command: 'echo "${WORKSPACE}"'
        - run: |
            echo "Planning ${STACK_NAME} for ${ENV_NAME} environment"
        - init:
            extra_args:
              - "-backend-config=../../environments/${ENV_NAME}/$(basename $(pwd))-backend.hcl"
        - plan:
            extra_args:
              - "-var-file=../../environments/${ENV_NAME}/$(basename $(pwd)).tfvars"
    apply:
      steps:
        - env:
            name: ENV_NAME
            command: 'echo "${WORKSPACE}"'
        - run: |
            echo "Applying $(basename $(pwd)) for ${ENV_NAME} environment"
        - apply
