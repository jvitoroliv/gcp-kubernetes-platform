  # ---------------------------------------------------------------------------
  - name: 01-foundation-dev
    dir: stacks/01-foundation
    workspace: dev
    terraform_version: v1.5.0
    autoplan:
      when_modified:
        - "*.tf"
        - "../../environments/dev/01-foundation*.tfvars"
