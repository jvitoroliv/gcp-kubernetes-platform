# =============================================================================
# ExternalSecret - GitHub ARC PAT (PRD)
# =============================================================================
# Syncs github-arc-pat from GCP Secret Manager to Kubernetes Secret
# Used by Actions Runner Controller for GitHub authentication
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-secret
  namespace: arc-runners
spec:
  # Refresh interval - how often to sync
  refreshInterval: 1h

  # Reference to ClusterSecretStore
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager

  # Target Kubernetes Secret
  target:
    name: arc-github-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        github_token: "{{ .github_token }}"

  # Data mapping from GCP Secret Manager
  data:
    - secretKey: github_token
      remoteRef:
        key: project-prd-github-arc-pat  # GCP Secret Manager secret name
