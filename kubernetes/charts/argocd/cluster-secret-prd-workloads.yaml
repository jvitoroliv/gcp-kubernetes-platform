# =============================================================================
# ArgoCD Cluster Secret - PRD Workloads
# =============================================================================
# Registers the PRD workloads cluster in ArgoCD running on PRD runners
# This allows ArgoCD to deploy applications to the workloads cluster
#
# NOTE: The bearerToken and caData must be populated by the bootstrap script
# after creating the ServiceAccount in the target cluster
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cluster-project-prd-workloads
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: project-prd-workloads
  server: "https://172.16.0.2"
  config: |
    {
      "bearerToken": "${BEARER_TOKEN}",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "${CA_DATA}"
      }
    }
