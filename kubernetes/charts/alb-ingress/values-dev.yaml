# ALB Ingress - DEV environment values

namespace: gameplatform-dev

# Static IP name created by Terraform (project-dev-alb-ip)
staticIpName: project-dev-alb-ip

# SSL Certificate name (managed by this chart via ManagedCertificate)
sslCertificateName: project-dev-alb-cert

# Domain suffix
domain: dev-gameplatform.example.com

# Service name prefix
servicePrefix: game-platform-dev

# Services configuration for hostname-based routing
services:
  nakama:
    hostname: nakama
    port: 7350
    healthCheckPath: /healthcheck
    timeoutSec: 3600

  lobby:
    hostname: lobby
    port: 3000
    healthCheckPath: /
    timeoutSec: 30

  lobby-backend:
    hostname: lobby-backend
    port: 3001
    healthCheckPath: /health
    timeoutSec: 30

  afs:
    hostname: afs
    port: 9933
    healthCheckPath: /ping
    timeoutSec: 60

  ahsat:
    hostname: ahsat
    port: 6969
    healthCheckPath: /ping
    timeoutSec: 60

  ais:
    hostname: ais
    port: 5050
    healthCheckPath: /health
    timeoutSec: 300

  aes:
    hostname: aes
    port: 1988
    healthCheckPath: /health
    timeoutSec: 30

  aps:
    hostname: aps
    port: 4444
    healthCheckPath: /v0/aps/ping
    timeoutSec: 60

# Default backend (for unmatched requests)
defaultBackend: lobby
