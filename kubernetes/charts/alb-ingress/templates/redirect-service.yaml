{{- /*
Service and BackendConfig for apex domain redirect
*/ -}}
{{- if .Values.redirect }}
{{- if .Values.redirect.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: redirect-backend-config
  namespace: {{ .Values.namespace }}
spec:
  timeoutSec: 30
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: redirect-service
  namespace: {{ .Values.namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "redirect-backend-config"}'
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: redirect-service
{{- end }}
{{- end }}
