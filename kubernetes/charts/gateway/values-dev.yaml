# Gateway configuration for DEV environment
# HTTPS on custom ports like AWS ALB

namespace: gameplatform-dev
gatewayClassName: gke-l7-global-external-managed
tlsSecretName: dev-gameplatform-tls

# Service name prefix (changes per environment)
servicePrefix: game-platform-dev

# Gateways - one per service/port (GKE limitation: one HTTPS listener per Gateway)
gateways:
  # Standard HTTPS on 443 for lobby (browser access)
  gw-https:
    port: 443
    listenerName: https

  # Nakama game server
  gw-nakama:
    port: 7350
    listenerName: nakama

  # AHSAT analytics
  gw-ahsat:
    port: 6969
    listenerName: ahsat

  # AFS file service
  gw-afs:
    port: 9933
    listenerName: afs

  # AIS AI service
  gw-ais:
    port: 5050
    listenerName: ais

  # AES email service
  gw-aes:
    port: 1988
    listenerName: aes

  # APS payments service
  gw-aps:
    port: 4444
    listenerName: aps

  # Lobby frontend (custom port)
  gw-lobby:
    port: 3000
    listenerName: lobby

  # Lobby backend API
  gw-lobby-backend:
    port: 3001
    listenerName: lobby-backend

# HTTPRoutes - maps gateways to backend services
routes:
  # Nakama
  nakama-route:
    gatewayName: gw-nakama
    sectionName: nakama
    backendService: game-platform-dev-nakama
    backendPort: 7350

  # AHSAT
  ahsat-route:
    gatewayName: gw-ahsat
    sectionName: ahsat
    backendService: game-platform-dev-ahsat
    backendPort: 6969

  # AFS
  afs-route:
    gatewayName: gw-afs
    sectionName: afs
    backendService: game-platform-dev-afs
    backendPort: 9933

  # AIS
  ais-route:
    gatewayName: gw-ais
    sectionName: ais
    backendService: game-platform-dev-ais
    backendPort: 5050

  # AES
  aes-route:
    gatewayName: gw-aes
    sectionName: aes
    backendService: game-platform-dev-aes
    backendPort: 1988

  # APS
  aps-route:
    gatewayName: gw-aps
    sectionName: aps
    backendService: game-platform-dev-aps
    backendPort: 4444

  # Lobby on custom port 3000
  lobby-route:
    gatewayName: gw-lobby
    sectionName: lobby
    backendService: game-platform-dev-lobby
    backendPort: 3000

  # Lobby on standard HTTPS 443 (for browser access via app.dev-gameplatform.example.com)
  # Uses wildcard DNS *.dev-gameplatform.example.com → gw-https
  lobby-https-route:
    gatewayName: gw-https
    sectionName: https
    hostname: app.dev-gameplatform.example.com
    backendService: game-platform-dev-lobby
    backendPort: 3000

  # Lobby backend on custom port 3001
  lobby-backend-route:
    gatewayName: gw-lobby-backend
    sectionName: lobby-backend
    backendService: game-platform-dev-lobby-backend
    backendPort: 3001

  # Lobby backend on standard HTTPS 443 (for API access via api.dev-gameplatform.example.com)
  # Uses wildcard DNS *.dev-gameplatform.example.com → gw-https
  lobby-backend-https-route:
    gatewayName: gw-https
    sectionName: https
    hostname: api.dev-gameplatform.example.com
    backendService: game-platform-dev-lobby-backend
    backendPort: 3001

# HealthCheckPolicy - custom health check paths for each service
healthCheckPolicies:
  nakama-healthcheck:
    serviceName: game-platform-dev-nakama
    path: /healthcheck

  ahsat-healthcheck:
    serviceName: game-platform-dev-ahsat
    path: /ping

  afs-healthcheck:
    serviceName: game-platform-dev-afs
    path: /ping

  ais-healthcheck:
    serviceName: game-platform-dev-ais
    path: /health

  aes-healthcheck:
    serviceName: game-platform-dev-aes
    path: /health

  aps-healthcheck:
    serviceName: game-platform-dev-aps
    path: /v0/aps/ping

  lobby-healthcheck:
    serviceName: game-platform-dev-lobby
    path: /

  lobby-backend-healthcheck:
    serviceName: game-platform-dev-lobby-backend
    path: /health
