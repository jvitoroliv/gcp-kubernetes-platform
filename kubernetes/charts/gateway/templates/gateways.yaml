{{- /*
GKE Gateway API - Multiple Gateways for custom HTTPS ports
Each service gets its own Gateway because GKE only supports one HTTPS listener per Gateway.
No hostname filter is set to handle HTTP/2 :authority header with port (e.g., service.domain:port)
*/ -}}
{{- range $name, $gw := .Values.gateways }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  gatewayClassName: {{ $.Values.gatewayClassName }}
  listeners:
    - name: {{ $gw.listenerName | default $name }}
      port: {{ $gw.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
