{{- /*
HTTPRoutes - Maps Gateway listeners to backend K8s Services
For custom ports: No hostname filter (HTTP/2 sends :authority with port)
For port 443: Hostname filter is used (443 is default and not included in :authority)
*/ -}}
{{- range $name, $route := .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  parentRefs:
    - name: {{ $route.gatewayName }}
      namespace: {{ $.Values.namespace }}
      sectionName: {{ $route.sectionName }}
  {{- if $route.hostname }}
  hostnames:
    - {{ $route.hostname | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $route.backendService }}
          port: {{ $route.backendPort }}
{{- end }}
