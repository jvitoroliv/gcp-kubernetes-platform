replicaCount: 1

image:
  repository: us-east1-docker.pkg.dev/project-nonprod-env/project-dev-images/lobby-backend
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: "gce"
  annotations: {}
  hosts:
    - host: api.dev.gameplatform
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls: []

env: []

# Environment variables from ConfigMap and Secrets
# ConfigMap is synced from monorepo environment-variables/ directory
# Secrets are synced from GCP Secret Manager via ExternalSecrets
envFrom:
  - configMapRef:
      name: lobby-backend-config
  - secretRef:
      name: lobby-backend-secrets

# External Secrets configuration (GCP Secret Manager)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  secrets:
    # Database - from Terraform stack 04-database
    - secretKey: DB_HOST
      remoteKey: project-dev-db-host
    - secretKey: DB_PASSWORD
      remoteKey: project-dev-db-nakama-password
    # Nakama keys - manual secrets
    - secretKey: NAKAMA_SERVER_KEY
      remoteKey: project-dev-nakama-server-key
    - secretKey: NAKAMA_HTTP_KEY
      remoteKey: project-dev-nakama-http-key
    # Email - manual secrets
    - secretKey: AES_API_KEY
      remoteKey: project-dev-aes-api-key
    - secretKey: SMTP_USER
      remoteKey: project-dev-smtp-user
    - secretKey: SMTP_PASSWORD
      remoteKey: project-dev-smtp-password
    # OAuth - manual secrets
    - secretKey: OAUTH_CLIENT_ID
      remoteKey: project-dev-google-client-id

nodeSelector: {}
tolerations: []
affinity: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  labels: {}
