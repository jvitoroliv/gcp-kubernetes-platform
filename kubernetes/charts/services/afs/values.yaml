replicaCount: 1

image:
  repository: us-east1-docker.pkg.dev/project-nonprod-env/project-dev-images/afs
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9933
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: "gce"
  annotations: {}
  hosts:
    - host: afs.dev.gameplatform
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls: []

env: []

# Environment variables from ConfigMap and Secrets
envFrom:
  - configMapRef:
      name: afs-config
  - secretRef:
      name: afs-secrets

# External Secrets configuration (GCP Secret Manager)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  secrets:
    # Database - from Terraform stack 04-database
    - secretKey: DB_HOST
      remoteKey: project-dev-db-host
    - secretKey: DB_PASSWORD
      remoteKey: project-dev-db-nakama-password

nodeSelector: {}
tolerations: []
affinity: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  labels: {}
