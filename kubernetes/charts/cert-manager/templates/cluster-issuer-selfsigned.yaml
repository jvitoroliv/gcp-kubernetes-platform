{{- if .Values.selfSignedIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gameplatform-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: gameplatform-ca
  secretName: gameplatform-ca-secret
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gameplatform-ca-issuer
spec:
  ca:
    secretName: gameplatform-ca-secret
{{- end }}
