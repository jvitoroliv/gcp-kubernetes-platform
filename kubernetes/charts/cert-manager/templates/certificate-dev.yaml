{{- if .Values.certificates.dev.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-gameplatform-tls
  namespace: {{ .Values.certificates.dev.namespace }}
spec:
  secretName: dev-gameplatform-tls
  duration: 2160h # 90 days (Let's Encrypt max)
  renewBefore: 720h # 30 days
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    {{- range .Values.certificates.dev.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    {{- if .Values.letsencrypt.enabled }}
    name: letsencrypt-dns
    {{- else }}
    name: gameplatform-ca-issuer
    {{- end }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
