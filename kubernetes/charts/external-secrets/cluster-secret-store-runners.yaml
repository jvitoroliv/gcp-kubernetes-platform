# =============================================================================
# ClusterSecretStore - Runners Cluster
# =============================================================================
# For: gameplatform-nonprod-runners cluster
# Uses Workload Identity with project-dev-eso-runners SA for authentication
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: project-nonprod-env
      auth:
        workloadIdentity:
          clusterLocation: us-east1
          clusterName: gameplatform-nonprod-runners
          clusterProjectID: project-nonprod-env
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
