# =============================================================================
# ClusterSecretStore - GCP Secret Manager
# =============================================================================
# Connects External Secrets Operator to GCP Secret Manager
# Uses Workload Identity for authentication
# =============================================================================
# NOTE: This file should be applied per-cluster with correct projectID:
#   dev/stg clusters: project-nonprod-env
#   prd cluster: project-prd-env
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: project-nonprod-env
