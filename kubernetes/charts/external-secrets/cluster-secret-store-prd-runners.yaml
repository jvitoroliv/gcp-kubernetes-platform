# =============================================================================
# ClusterSecretStore - PRD Runners Cluster
# =============================================================================
# For: project-prd-runners cluster
# Uses Workload Identity with project-prd-eso-runners SA for authentication
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: project-prd-env
      auth:
        workloadIdentity:
          clusterLocation: southamerica-east1
          clusterName: project-prd-runners
          clusterProjectID: project-prd-env
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
