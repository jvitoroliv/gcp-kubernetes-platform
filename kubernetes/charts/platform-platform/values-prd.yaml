# Production environment values for game-platform
# Deployed to namespace: gameplatform-prd
# CI/CD automatically updates image tags in this file.
#
# Usage:
#   helm install game-platform . -n gameplatform-prd -f values.yaml -f values-prd.yaml

global:
  imageRegistry: southamerica-east1-docker.pkg.dev/project-prd-env/project-prd-images
  imagePullPolicy: IfNotPresent
  domain: gameplatform.example.com
  # GitHub Environment — enables deployment protection rules and secrets scoping
  environment: prd

  # Database configuration
  database:
    secretName: postgres-credentials
    host: "" # Will be set from Cloud SQL private IP
    connectionName: "project-prd-env:southamerica-east1:project-prd-postgres"

  # External Secrets Operator
  externalSecrets:
    enabled: true
    clusterSecretStore: gcp-secret-manager

  # Monitoring (enabled in prd)
  monitoring:
    enabled: true
    prometheus:
      enabled: true
    grafana:
      enabled: true

  # Ingress (nginx with External Load Balancer + TLS)
  ingress:
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: prd-gameplatform-tls

# Service-specific configurations
nakama:
  enabled: true
  replicaCount: 1
  image:
    tag: "prd-a1408fa"
  serviceMonitor:
    enabled: true
  podSecurityContext:
    runAsNonRoot: false
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 2048m
      memory: 4096Mi
    limits:
      cpu: 2048m
      memory: 4096Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  livenessProbe:
    httpGet:
      path: /
      port: 7350
    initialDelaySeconds: 300
    periodSeconds: 60
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 15
  readinessProbe:
    httpGet:
      path: /
      port: 7350
    initialDelaySeconds: 300
    periodSeconds: 60
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 15
  database:
    cloudSqlProxy:
      enabled: false
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
      cloud.google.com/backend-config: '{"default": "nakama-backend-config"}'
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.gameplatform.example.com"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Accept"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: nakama.gameplatform.example.com
        paths:
          - path: /
            pathType: Prefix
            port: 7350
    tls:
      - secretName: prd-gameplatform-tls
        hosts:
          - nakama.gameplatform.example.com
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: gcp-secret-manager
      kind: ClusterSecretStore
    secrets:
      - secretKey: NAKAMA_DATABASE_ADDRESS
        remoteKey: project-prd-db-nakama-connection
      - secretKey: DB_HOST
        remoteKey: project-prd-db-host
      - secretKey: DB_PASSWORD
        remoteKey: project-prd-db-nakama-password
      - secretKey: NAKAMA_HTTP_KEY
        remoteKey: project-prd-nakama-http-key
      - secretKey: NAKAMA_SERVER_KEY
        remoteKey: project-prd-nakama-server-key
      - secretKey: AES_KEY
        remoteKey: project-prd-aes-encryption-key

