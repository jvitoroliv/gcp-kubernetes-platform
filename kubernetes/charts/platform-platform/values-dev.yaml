# Development environment values for game-platform
# Deployed to namespace: gameplatform-dev
# CI/CD automatically updates image tags in this file.
#
# Usage:
#   helm install game-platform . -n gameplatform-dev -f values.yaml -f values-dev.yaml

global:
  imageRegistry: us-east1-docker.pkg.dev/project-nonprod-env/project-dev-images
  imagePullPolicy: IfNotPresent
  domain: dev-gameplatform.example.com
  # GitHub Environment — enables deployment protection rules and secrets scoping
  environment: dev

  # Database configuration
  database:
    secretName: postgres-credentials
    host: "10.148.0.3"

  # External Secrets Operator
  externalSecrets:
    enabled: true
    clusterSecretStore: gcp-secret-manager

  # Monitoring
  monitoring:
    enabled: true
    prometheus:
      enabled: true
    grafana:
      enabled: true

  # Ingress (nginx with Internal Load Balancer + TLS)
  ingress:
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: dev-gameplatform-tls

# Service-specific configurations
nakama:
  enabled: true
  replicaCount: 1
  image:
    tag: "dev-b29c33f"
  serviceMonitor:
    enabled: true
    labels:
      prometheus: enabled
  podSecurityContext:
    runAsNonRoot: false
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  database:
    cloudSqlProxy:
      enabled: false
  # Service annotations for GKE ALB integration
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
      cloud.google.com/backend-config: '{"default": "nakama-backend-config"}'
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://lobby.dev-gameplatform.example.com"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Accept"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: nakama.dev-gameplatform.example.com
        paths:
          - path: /
            pathType: Prefix
            port: 7350
    tls:
      - secretName: dev-gameplatform-tls
        hosts:
          - nakama.dev-gameplatform.example.com
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: gcp-secret-manager
      kind: ClusterSecretStore
    secrets:
      - secretKey: NAKAMA_DATABASE_ADDRESS
        remoteKey: project-dev-db-nakama-connection
      - secretKey: DB_HOST
        remoteKey: project-dev-db-host
      - secretKey: DB_PASSWORD
        remoteKey: project-dev-db-nakama-password
      - secretKey: NAKAMA_HTTP_KEY
        remoteKey: project-dev-nakama-http-key
      - secretKey: NAKAMA_SERVER_KEY
        remoteKey: project-dev-nakama-server-key
      - secretKey: AES_KEY
        remoteKey: project-dev-aes-encryption-key

