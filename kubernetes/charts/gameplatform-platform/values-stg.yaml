# Staging environment values for game-platform
# Deployed to namespace: gameplatform-stg
# CI/CD automatically updates image tags in this file.
#
# Usage:
#   helm install game-platform . -n gameplatform-stg -f values.yaml -f values-stg.yaml

global:
  imageRegistry: us-east1-docker.pkg.dev/project-nonprod-env/project-stg-images
  imagePullPolicy: IfNotPresent
  domain: stg-gameplatform.example.com
  environment: stg

  # Database configuration
  database:
    secretName: postgres-credentials
    host: "10.148.0.7"
    connectionName: "project-nonprod-env:us-east1:project-stg-postgres"

  # External Secrets Operator
  externalSecrets:
    enabled: true
    clusterSecretStore: gcp-secret-manager

  # Monitoring
  monitoring:
    enabled: true
    prometheus:
      enabled: true
    grafana:
      enabled: true

  # Ingress (nginx with Internal Load Balancer + TLS)
  ingress:
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: stg-gameplatform-tls

# Service-specific configurations
nakama:
  enabled: true
  replicaCount: 1
  image:
    tag: "stg-18cd170"
  serviceMonitor:
    enabled: true
  podSecurityContext:
    runAsNonRoot: false
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 2048m
      memory: 4096Mi
    limits:
      cpu: 2048m
      memory: 4096Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  # Probe config matching AWS ECS health check settings
  livenessProbe:
    httpGet:
      path: /
      port: 7350
    initialDelaySeconds: 120
    periodSeconds: 60
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /
      port: 7350
    initialDelaySeconds: 60
    periodSeconds: 60
    timeoutSeconds: 30
    successThreshold: 1
    failureThreshold: 10
  database:
    cloudSqlProxy:
      enabled: false
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
      cloud.google.com/backend-config: '{"default": "nakama-backend-config"}'
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://lobby.stg-gameplatform.example.com"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Accept"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: nakama.stg-gameplatform.example.com
        paths:
          - path: /
            pathType: Prefix
            port: 7350
    tls:
      - secretName: stg-gameplatform-tls
        hosts:
          - nakama.stg-gameplatform.example.com
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: gcp-secret-manager
      kind: ClusterSecretStore
    secrets:
      - secretKey: NAKAMA_DATABASE_ADDRESS
        remoteKey: project-stg-db-nakama-connection
      - secretKey: DB_HOST
        remoteKey: project-stg-db-host
      - secretKey: DB_PASSWORD
        remoteKey: project-stg-db-nakama-password
      - secretKey: NAKAMA_HTTP_KEY
        remoteKey: project-stg-nakama-http-key
      - secretKey: NAKAMA_SERVER_KEY
        remoteKey: project-stg-nakama-server-key
      - secretKey: AES_KEY
        remoteKey: project-stg-aes-encryption-key

