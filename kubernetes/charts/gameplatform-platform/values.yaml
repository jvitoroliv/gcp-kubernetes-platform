# Default values for game-platform
# This file contains ONLY generic defaults shared across all environments.
# Environment-specific values are in values-{env}.yaml files.
#
# Usage:
#   helm install game-platform . -f values-dev.yaml  (DEV uses values.yaml + values-dev.yaml)
#   helm install game-platform . -f values-stg.yaml  (STG uses values.yaml + values-stg.yaml)
#   helm install game-platform . -f values-prd.yaml  (PRD uses values.yaml + values-prd.yaml)
#
# CI/CD automatically updates image tags in the appropriate values-{env}.yaml file.

global:
  imagePullPolicy: IfNotPresent

  # External Secrets Operator (enabled for all environments)
  externalSecrets:
    enabled: true
    clusterSecretStore: gcp-secret-manager

  # Monitoring (disabled by default, enabled in prd)
  monitoring:
    enabled: false
    prometheus:
      enabled: false
    grafana:
      enabled: false

  # Ingress defaults
  ingress:
    className: gce
    annotations:
      kubernetes.io/ingress.allow-http: "false"
    tls:
      enabled: true

# Service defaults - these are overridden per environment
nakama:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: false
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  database:
    cloudSqlProxy:
      enabled: false
  ingress:
    enabled: true

