apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-stg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example-gamedev-org/platform-kubernetes-infrastructure.git
    targetRevision: main
    path: charts/cert-manager
    helm:
      valueFiles:
        - values-stg.yaml
  destination:
    name: project-stg-workloads
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
