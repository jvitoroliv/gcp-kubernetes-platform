apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-ingress-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example-gamedev-org/platform-kubernetes-infrastructure.git
    targetRevision: main
    path: charts/alb-ingress
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    name: project-dev-workloads
    namespace: gameplatform-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
