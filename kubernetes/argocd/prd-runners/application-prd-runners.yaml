apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd-runners-argocd-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example-gamedev-org/platform-kubernetes-infrastructure.git
    targetRevision: main
    path: argocd/prd-runners
  destination:
    # Same cluster where ArgoCD runs (prd-runners)
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
