apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      # ProjectID will be set via kustomize patch per environment:
      # dev/stg: project-nonprod-env
      # prd: project-prd-env
      projectID: "REPLACE_WITH_PROJECT_ID"
      auth:
        workloadIdentity:
          # ClusterLocation will be set via kustomize patch per environment:
          # dev/stg: us-east1
          # prd: southamerica-east1
          clusterLocation: REPLACE_WITH_REGION
          # ClusterName pattern: gameplatform-{env}-workloads
          clusterName: REPLACE_WITH_CLUSTER_NAME
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
