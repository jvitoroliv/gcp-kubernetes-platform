apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gameplatform-ingress
  namespace: gameplatform-stg
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "project-stg-ip"
    networking.gke.io/managed-certificates: "project-stg-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: nakama.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: nakama
            port:
              number: 7350
  - host: lobby.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: lobby
            port:
              number: 3000
  - host: lobby-backend.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: lobby-backend
            port:
              number: 3001
  - host: afs.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: afs
            port:
              number: 8080
  - host: ahsat.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: ahsat
            port:
              number: 8080
  - host: aes.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: aes
            port:
              number: 1988
  - host: ais.stg.gameplatform
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: ais
            port:
              number: 5050
