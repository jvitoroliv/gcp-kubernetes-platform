# values.yaml — Helm chart values

# values.yaml — Helm chart values

replicaCount: 1

image:
  repository: us-east1-docker.pkg.dev/platform-nonprod-env/platform-dev-images/aps
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4444
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: "gce"
  annotations: {}
  hosts:
    - host: aps.dev.platform
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls: []

env: []

# Environment variables from ConfigMap and Secrets
envFrom:
  - configMapRef:
      name: aps-config
  - secretRef:
      name: aps-secrets

# External Secrets configuration (GCP Secret Manager)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  secrets:
    # Payment/Yuno - manual secrets
    - secretKey: YUNO_PUBLIC_KEY
      remoteKey: platform-dev-yuno-public-key
    - secretKey: YUNO_PRIVATE_KEY
      remoteKey: platform-dev-yuno-private-key
    - secretKey: YUNO_ACCOUNT_ID
      remoteKey: platform-dev-yuno-account-id

livenessProbe:
  httpGet:
    path: /v0/aps/ping
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v0/aps/ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  labels: {}
