# service.yaml
# service configuration
# Maintained by: Platform Engineering

# service.yaml — service configuration

apiVersion: v1
kind: Service
metadata:
  name: {{ include "aps.fullname" . }}
  labels:
    {{- include "aps.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "aps.selectorLabels" . | nindent 4 }}
