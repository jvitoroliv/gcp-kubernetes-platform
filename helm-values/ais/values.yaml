# values.yaml — Helm chart values

# values.yaml — Helm chart values

replicaCount: 1

image:
  repository: us-east1-docker.pkg.dev/platform-nonprod-env/platform-dev-images/ais
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5050
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: "gce"
  annotations: {}
  hosts:
    - host: ais.dev.platform
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls: []

env: []

# Environment variables from ConfigMap and Secrets
envFrom:
  - configMapRef:
      name: ais-config
  - secretRef:
      name: ais-secrets

# External Secrets configuration (GCP Secret Manager)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  secrets:
    # Database - from Terraform stack 04-database
    - secretKey: DB_HOST
      remoteKey: platform-dev-db-host
    - secretKey: DB_PASSWORD
      remoteKey: platform-dev-db-nakama-password
    # AI - manual secrets
    - secretKey: AIS_APP_SECRET
      remoteKey: platform-dev-ais-app-secret
    - secretKey: PIAPI_KEY
      remoteKey: platform-dev-piapi-key
    - secretKey: GEMINI_API_KEY
      remoteKey: platform-dev-gemini-api-key

nodeSelector: {}
tolerations: []
affinity: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  labels: {}
