# backend-config.yaml
# state backend configuration

{{- if .Values.backendConfig.enabled -}}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.backendConfig.name }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
spec:
  timeoutSec: {{ .Values.backendConfig.timeoutSec | default 30 }}
  healthCheck:
    checkIntervalSec: {{ .Values.backendConfig.healthCheck.checkIntervalSec | default 15 }}
    timeoutSec: {{ .Values.backendConfig.healthCheck.timeoutSec | default 10 }}
    healthyThreshold: {{ .Values.backendConfig.healthCheck.healthyThreshold | default 1 }}
    unhealthyThreshold: {{ .Values.backendConfig.healthCheck.unhealthyThreshold | default 3 }}
    type: HTTP
    requestPath: {{ .Values.backendConfig.healthCheck.requestPath | default "/api/health" }}
    port: {{ .Values.backendConfig.healthCheck.port | default 3000 }}
{{- end }}
