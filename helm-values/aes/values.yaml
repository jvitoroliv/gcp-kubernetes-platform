# values.yaml
# Helm chart values
# Maintained by: Platform Engineering

# values.yaml — Helm chart values

replicaCount: 1

image:
  repository: us-east1-docker.pkg.dev/platform-nonprod-env/platform-dev-images/aes
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 1988
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: "gce"
  annotations: {}
  hosts:
    - host: aes.dev.platform
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls: []

env: []

# Environment variables from ConfigMap and Secrets
envFrom:
  - configMapRef:
      name: aes-config
  - secretRef:
      name: aes-secrets

# External Secrets configuration (GCP Secret Manager)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  secrets:
    # Email - manual secrets
    - secretKey: AES_API_KEY
      remoteKey: platform-dev-aes-api-key
    - secretKey: SMTP_USER
      remoteKey: platform-dev-smtp-user
    - secretKey: SMTP_PASSWORD
      remoteKey: platform-dev-smtp-password

nodeSelector: {}
tolerations: []
affinity: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}
